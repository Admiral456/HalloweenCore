name: HalloweenCore
version: 0.1.0-SNAPSHOT
main: cz.halloween.core.HalloweenCore
api-version: '1.21'
author: Admiral456
description: Halloween progression with vanilla events, pumpkin villager and underground caches.
softdepend: [ItemsAdder, PlaceholderAPI]
commands:
  halloween:
    description: Halloween progression, rewards and administration.
    usage: /halloween [stats|progress|curse|challenge|rewards|claim|top|event|ambience|secrets|setsecret|npc|cache|reload|debug|give|on|off] (ambience: status|on|off|test)
    aliases: [hallow]
    permission: halloweencore.use
permissions:
  halloweencore.use:
    default: true
  halloweencore.admin:
    default: op
