# HalloweenCore — dialogové questy a tajné podzemní místnosti.
# Odměny používají pouze vanilla materiály; všechny rarity klíče sdílejí stejnou existující secret_key texturu.

secret-rooms:
  enabled: true
  # Doplň přesný název běžného herního světa. Prázdný seznam bezpečně vypíná generování.
  worlds: []
  excluded-worlds:
    - "Spawn"
  # Pokus o místnost na každý nově generovaný chunk. Už prozkoumané chunky se znovu neprohledávají.
  chance-per-new-chunk: 0.01
  min-depth-below-surface: 16
  max-depth-below-surface: 28

  # Poměry rarit místností. Klíče jsou stejné textury, ale mají serverem kontrolovanou raritu.
  rarity-weights:
    common: 70
    rare: 25
    legendary: 5

  # Fragmenty se připíšou hráči, který místnost odemkne; vanilla předměty se vloží do truhly.
  # Každá místnost dostane raritu a loot pouze jednou.
  loot:
    common:
      min-fragments: 8
      max-fragments: 16
      items:
        - material: COAL
          min: 4
          max: 12
          chance: 0.90
        - material: IRON_INGOT
          min: 3
          max: 8
          chance: 0.85
        - material: GOLD_INGOT
          min: 1
          max: 4
          chance: 0.45
        - material: EMERALD
          min: 1
          max: 3
          chance: 0.30
        - material: BREAD
          min: 2
          max: 5
          chance: 0.50
        - material: COOKED_BEEF
          min: 2
          max: 5
          chance: 0.50
        - material: REDSTONE
          min: 4
          max: 12
          chance: 0.40
        # Malá šance na lepší bonus.
        - material: DIAMOND
          min: 1
          max: 1
          chance: 0.03

    rare:
      min-fragments: 20
      max-fragments: 35
      items:
        - material: DIAMOND
          min: 1
          max: 3
          chance: 0.95
        - material: GOLD_INGOT
          min: 4
          max: 10
          chance: 0.80
        - material: IRON_INGOT
          min: 8
          max: 16
          chance: 0.85
        - material: EMERALD
          min: 2
          max: 6
          chance: 0.60
        - material: ENCHANTED_BOOK
          min: 1
          max: 1
          chance: 0.40
          enchantments:
            - "unbreaking:2"
            - "efficiency:2"
            - "protection:2"
        - material: DIAMOND_PICKAXE
          min: 1
          max: 1
          chance: 0.12
          enchantments:
            - "efficiency:2"
            - "unbreaking:2"
        - material: DIAMOND_SWORD
          min: 1
          max: 1
          chance: 0.10
          enchantments:
            - "sharpness:2"
            - "unbreaking:2"
        - material: GOLDEN_APPLE
          min: 1
          max: 1
          chance: 0.10

    legendary:
      min-fragments: 40
      max-fragments: 70
      items:
        - material: DIAMOND
          min: 4
          max: 8
          chance: 0.95
        - material: EMERALD
          min: 4
          max: 10
          chance: 0.80
        - material: GOLD_INGOT
          min: 8
          max: 16
          chance: 0.80
        - material: ENCHANTED_BOOK
          min: 1
          max: 1
          chance: 0.24
          enchantments:
            - "mending:1"
            - "sharpness:4"
            - "protection:4"
        - material: DIAMOND_SWORD
          min: 1
          max: 1
          chance: 0.20
          enchantments:
            - "sharpness:3"
            - "unbreaking:3"
        - material: DIAMOND_PICKAXE
          min: 1
          max: 1
          chance: 0.20
          enchantments:
            - "efficiency:3"
            - "unbreaking:2"
        - material: DIAMOND_CHESTPLATE
          min: 1
          max: 1
          chance: 0.10
          enchantments:
            - "protection:3"
            - "unbreaking:2"
        - material: GOLDEN_APPLE
          min: 1
          max: 2
          chance: 0.25
        - material: NETHERITE_SCRAP
          min: 1
          max: 2
          chance: 0.06
        - material: TOTEM_OF_UNDYING
          min: 1
          max: 1
          chance: 0.02

# BetonQuest drží texty, nabídky a podmínky dialogů. HalloweenCore vyplácí odměny.
# Pro konkrétní ID nastav quest-rewards.quests.<id>; ukázkový farmar_wheat dává 5 fragmentů
# bez klíče. Ostatní neznámá ID používají výchozí obtížnost.
quest-rewards:
  default-difficulty: light
  difficulties:
    light:
      min-fragments: 3
      max-fragments: 5
      key-chances:
        common: 0.10
        rare: 0.01
        legendary: 0.001
    medium:
      min-fragments: 6
      max-fragments: 9
      key-chances:
        common: 0.15
        rare: 0.035
        legendary: 0.005
    hard:
      min-fragments: 10
      max-fragments: 15
      key-chances:
        common: 0.20
        rare: 0.06
        legendary: 0.02
    very-hard:
      min-fragments: 16
      max-fragments: 25
      key-chances:
        common: 0.25
        rare: 0.10
        legendary: 0.08
  quests:
    # Testovací BetonQuest dialog; částku můžeš změnit, nebo položku odstranit.
    farmer_wheat:
      difficulty: light
      fragments: 5
      key-chances:
        common: 0.0
        rare: 0.0
        legendary: 0.0
