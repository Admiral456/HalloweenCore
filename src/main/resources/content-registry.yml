# Minecraft profiles are deliberately opt-in. A version becomes verified only after its
# ItemsAdder schema, models, server build and client resource-pack delivery pass staging.
target-versions:
  default: "1.21.10"
  verified:
    - "1.21.10"
  pending:
    - "1.21.1"
    - "1.21.2"

# These file paths are integration data, not runtime item identity. The validator rejects
# missing and unregistered files; ASSET_MANIFEST.json records SHA-256 for generated builds.
model-assets:
