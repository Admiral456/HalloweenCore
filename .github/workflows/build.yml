name: Build HalloweenCore

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure audio encoder
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate Halloween audio
        run: python3 scripts/generate_halloween_audio.py
      # Project-owned world-decoration textures are deterministic 16x16 Minecraft pixel art.
      - name: Generate Halloween block textures
        run: python3 scripts/generate_halloween_block_textures.py
      # Player-owned shop and gear icons are reproducibly generated. Artist-owned mob UV atlases remain untouched.
      - name: Generate Halloween item textures
        run: python3 scripts/generate_halloween_item_textures.py
      - name: Validate canonical content registry and imported asset provenance
        run: python3 scripts/validate_halloween_content_registry.py
      - name: Validate all model, decoration, armor and sound registry paths
        run: python3 scripts/validate_content_registry.py
      # Artist-owned mob PNGs are checked as committed; CI must not regenerate/recolor those textures.
      - name: Validate Halloween assets
        run: python3 scripts/validate_halloween_assets.py
      - name: Validate Vampire King model
        run: python3 scripts/validate_vampire_model.py
      # Optional artist-owned mob atlases/models are packaged only when present; no recoloring/generation here.
      - name: Validate custom Halloween mob models
        run: python3 scripts/validate_special_mob_models.py
      - name: Validate Halloween runtime rules
        run: python3 scripts/validate_halloween_runtime_rules.py
      - name: Test Halloween event behavior contract
        run: python3 scripts/test_halloween_event_semantics.py
      - name: Build deterministic asset manifest
        run: python3 scripts/build_halloween_asset_manifest.py --minecraft-version 1.21.10
      - name: Verify deterministic asset manifest
        run: python3 scripts/build_halloween_asset_manifest.py --minecraft-version 1.21.10 --check
      - name: Test content registry and deterministic packaging
        run: python3 scripts/test_halloween_asset_pipeline.py
      - name: Build
        run: mvn -B clean package
      - name: Package ItemsAdder content reproducibly
        run: |
          mkdir -p target
          python3 scripts/package_deterministic_zip.py \
            --root itemsadder/contents \
            --include warriorland_halloween \
            --output target/WarriorLand-Halloween-ItemsAdder-mc1.21.10.zip \
            --minecraft-version 1.21.10 \
            --metadata-path warriorland_halloween/BUILD_METADATA.json
      - name: Upload ItemsAdder content pack
        uses: actions/upload-artifact@v4
        with:
          name: WarriorLand-Halloween-ItemsAdder-mc1.21.10
          path: target/WarriorLand-Halloween-ItemsAdder-mc1.21.10.zip
          if-no-files-found: error
          retention-days: 14
      - name: Package special mob models
        run: |
          mkdir -p target/halloween-mob-pack/MythicMobs/Mobs target/halloween-mob-pack/ModelEngine/blueprints
          cp mythicmobs/mobs/halloween-special-mobs.yml target/halloween-mob-pack/MythicMobs/Mobs/
          cp mythicmobs/models/halloween_*.bbmodel target/halloween-mob-pack/ModelEngine/blueprints/
          cp mythicmobs/models/halloween_*.png target/halloween-mob-pack/ModelEngine/blueprints/
          cp mythicmobs/README.md target/halloween-mob-pack/README.txt
          python3 scripts/package_deterministic_zip.py \
            --root target/halloween-mob-pack \
            --output target/HalloweenCore-Special-Mobs-ModelEngine-mc1.21.10.zip \
            --minecraft-version 1.21.10 \
            --metadata-path BUILD_METADATA.json
          unzip -t target/HalloweenCore-Special-Mobs-ModelEngine-mc1.21.10.zip
      - name: Upload special mob ModelEngine pack
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-Special-Mobs-ModelEngine-mc1.21.10
          path: target/HalloweenCore-Special-Mobs-ModelEngine-mc1.21.10.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-jar
          path: target/HalloweenCore.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA-256 asset manifest
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-Asset-Manifest-mc1.21.10
          path: itemsadder/contents/warriorland_halloween/ASSET_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
