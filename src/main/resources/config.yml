# HalloweenCore — nová omezená verze.
# Staré moby, bossové, původní eventy, jejich odměny, obchod, hudba a staré struktury zde nejsou.

# Tajné podzemní místnosti vznikají výhradně v nově generovaných chunkech.
secret-rooms:
  enabled: true
  # Doplň přesný název běžného herního světa. Prázdný seznam znamená bezpečně vypnuté generování.
  worlds: []
  excluded-worlds:
    - "Spawn"
  chance-per-new-chunk: 0.01
  min-depth-below-surface: 16
  max-depth-below-surface: 28

# Odměny za úkoly zatím nejsou domluvené. Výchozí sekce proto zůstává prázdná.
# Po dohodě lze ke konkrétnímu ID přidat fragments a/nebo commands:
# quest-rewards:
#   id_ukolu:
#     fragments: 0
#     commands: []
quest-rewards: {}
