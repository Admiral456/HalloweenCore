# Hlavní boss – specifikace je záměrně připravená před samotnou implementací.
# U upíra je pevně dané minimum: 10 bloků výšky a 8 bloků šířky včetně křídel.
# Později bude napojený na MythicMobs a vlastní model/resource pack.
bosses:
  vampire:
    enabled: false
    id: "vampire-king"
    display-name: "&4&lKRÁL UPÍRŮ"
    min-height-blocks: 10
    min-width-with-wings-blocks: 8
    wings-required: true
    arena:
      configured: false
      world: ""
      x: 0
      y: 100
      z: 0
    arena-required: true
    final-boss: true
    limited-to-event: true
    spawn-requirements:
      global-progress-percent: 100
      event-completion: true
    summoning:
      automatic: true
      # The natural countdown starts only when the finale, arena and real model are ready.
      delay-after-readiness-seconds: 300
      retry-delay-minutes: 20
      minimum-online-players: 1
    model:
      provider: MODEL_ENGINE
      id: vampire_king
      required: true
      plugin-required: true
      ready: false
      min-height-blocks: 10
      min-width-with-wings-blocks: 8
      wings-required: true
    boss-bar:
      enabled: true
      radius-blocks: 96
      color: RED
      style: SEGMENTED_20
    encounter:
      max-duration-minutes: 20
      arena-radius-blocks: 48
      participation-radius-blocks: 96
      leash-to-arena: true
      min-participation-seconds: 120
      minimum-damage-percent: 2.5
      participation-reward-fragments: 500
      victory-reward-fragments: 5000
      top-contributor-bonus-fragments: 2000
      abilities:
        enabled: true
        target-radius-blocks: 48
        phase-1-cooldown-seconds: 14
        phase-1-radius: 2.5
        phase-1-damage: 3.0
        phase-2-cooldown-seconds: 11
        phase-2-radius: 7
        phase-2-damage: 5.0
        phase-3-cooldown-seconds: 10
        phase-3-teleport-distance: 5
        phase-3-radius: 2.75
        phase-3-damage: 7.0
        phase-4-cooldown-seconds: 9
        phase-4-radius: 10
        phase-4-damage: 7.0

