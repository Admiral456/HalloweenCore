name: HalloweenCore
version: 0.1.0-SNAPSHOT
main: cz.halloween.core.HalloweenCore
api-version: '1.21'
author: Admiral456
description: Halloween progression core; legacy custom assets and event systems disabled during rebuild.
softdepend: [ItemsAdder, MythicMobs, ModelEngine, BattlePass, WorldGuard, PlaceholderAPI]
commands:
  halloween:
    description: Halloween progression, rewards and administration.
    usage: /halloween [stats|progress|curse|challenge|rewards|claim|top|reload|debug|give|on|off]
    aliases: [hallow]
    permission: halloweencore.use
permissions:
  halloweencore.use:
    default: true
  halloweencore.admin:
    default: op
