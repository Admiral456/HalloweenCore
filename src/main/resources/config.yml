# HalloweenCore: daily quests, fragments and shop.
season:
  enabled: true

# Inclusive, using the Europe/Prague timezone.
activeWindow:
  startMonth: 10
  startDay: 23
  endMonth: 11
  endDay: 2

quest-rewards:
  default-difficulty: light
  difficulties:
    light: {min-fragments: 3, max-fragments: 5}
    medium: {min-fragments: 6, max-fragments: 9}
    hard: {min-fragments: 10, max-fragments: 15}
    very-hard: {min-fragments: 16, max-fragments: 25}
  quests: {}

daily-quest:
  enabled: true
  reward-fragments: 1

shop:
  enabled: true
  prices:
    candy: 3
    iron: 8
    gold: 15
    diamond: 35
    emerald: 25
    netherite-ingot: 150
    netherite-scrap: 70
    golden-apple: 18
    enchanted-golden-apple: 80
    totem: 350
    trident: 550
    mace: 800
    netherite-sword: 400
    netherite-axe: 350
    netherite-helmet: 250
    netherite-chestplate: 500
    netherite-leggings: 400
    netherite-boots: 200
    elytra: 1200
    netherite-spear: 900
