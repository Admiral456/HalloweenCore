name: HalloweenCore
version: 0.2.0
main: cz.halloween.core.HalloweenCore
api-version: '1.21'
author: Admiral456
description: Dialogové questy a tajné podzemní místnosti se speciálním klíčem.
softdepend: [ItemsAdder, PlaceholderAPI, BetonQuest, Citizens]
commands:
  halloween:
    description: Questové příkazy, fragmenty a tajné místnosti.
    usage: /halloween [quest|fragments|key|rooms|reload]
    aliases: [hallow]
    permission: halloweencore.use
permissions:
  halloweencore.use:
    description: Používání HalloweenCore questových příkazů.
    default: true
  halloweencore.admin:
    description: Správa konfigurace HalloweenCore.
    default: op
  halloweencore.key.give:
    description: Administrátorské vydávání speciálních klíčů.
    default: op
  halloweencore.quest.dialogue:
    description: Oprávnění pro řízení questů z dialogů BetonQuest.
    default: op
