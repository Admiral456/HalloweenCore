name: Build HalloweenCore

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Halloween assets
        run: python3 scripts/validate_halloween_assets.py
      - name: Validate Vampire King model
        run: python3 scripts/validate_vampire_model.py
      - name: Build
        run: mvn -B clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-jar
          path: target/HalloweenCore.jar
          if-no-files-found: error
          retention-days: 14
