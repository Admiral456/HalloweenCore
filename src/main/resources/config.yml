enabled: true

global-goal: 100000

# Milníky odemykají další intenzitu eventu a dávají serveru společný cíl.
global-milestones:
  - 10000
  - 25000
  - 50000
  - 75000
  - 100000

currency:
  name: "fragmentů"

itemsadder:
  minimum-version: "4.0.13"

gameplay:
  allowed-gamemodes:
    - SURVIVAL
    - ADVENTURE
  worlds:
    mode: BLACKLIST
    names: []

rewards:
  mob-kill:
    enabled: true
    fragments: 1

  mining:
    enabled: true
    fragments: 1
    # Hard cap per player; helps keep block-reset farms and macros from flooding server progress.
    max-fragment-rewards-per-minute: 45
    blocks:
      - COAL_ORE
      - DEEPSLATE_COAL_ORE
      - COPPER_ORE
      - DEEPSLATE_COPPER_ORE
      - IRON_ORE
      - DEEPSLATE_IRON_ORE
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - REDSTONE_ORE
      - DEEPSLATE_REDSTONE_ORE
      - LAPIS_ORE
      - DEEPSLATE_LAPIS_ORE
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - ANCIENT_DEBRIS

  farming:
    enabled: true
    fragments: 2
    max-fragment-rewards-per-minute: 80
    require-mature: true
    blocks:
      - WHEAT
      - CARROTS
      - POTATOES
      - BEETROOTS
      - NETHER_WART
      - COCOA
      - SWEET_BERRY_BUSH
      - PUMPKIN
      - MELON

  fishing:
    enabled: true
    fragments: 2
    # Prevents extremely fast automated catch loops from dominating fragment progression.
    max-fragment-rewards-per-minute: 12

  passive-effects:
    enabled: true
    hunter-mask-night-vision-seconds: 5

  shop:
    hunter-mask:
      cost: 4000
      min-curse: 3
      itemsadder-id: "warriorland_halloween:hunter_mask"
      bonus-multiplier: 0.05
      material: CARVED_PUMPKIN
      amount: 1
      name: "&6&lMaska nočního lovce &8[Halloween 2026]"
      lore:
        - "&7Limitovaná odměna."
        - "&7Během eventu 2026 ji můžeš získat"
        - "&7jen jednou."

    cursed-talisman:
