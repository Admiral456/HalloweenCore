name: Build HalloweenCore

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Halloween assets
        run: python3 scripts/validate_halloween_assets.py
      - name: Build
        run: mvn -B clean package
