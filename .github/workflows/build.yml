name: Build HalloweenCore

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate the reduced feature scope and retained textures
        run: python3 scripts/validate_new_scope.py
      - name: Build plugin JAR
        run: mvn -B clean package
      - name: Package retained ItemsAdder content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("itemsadder/contents")
          output = Path("target/WarriorLand-Halloween-ItemsAdder-mc1.21.10.zip")
          output.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(output, "w", compression=ZIP_DEFLATED) as archive:
              for path in sorted((root / "warriorland_halloween").rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          with ZipFile(output) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Invalid ZIP entry: {bad}")
          PY
      - name: Create checksums
        run: |
          sha256sum target/HalloweenCore.jar target/WarriorLand-Halloween-ItemsAdder-mc1.21.10.zip > target/SHA256SUMS.txt
      - name: Upload plugin and ItemsAdder artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-dialogues-secret-rooms
          path: |
            target/HalloweenCore.jar
            target/WarriorLand-Halloween-ItemsAdder-mc1.21.10.zip
            target/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
