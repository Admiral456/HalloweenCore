# HalloweenCore Iris shader pack
# Target: Minecraft Java 1.21.10 + Iris + Sodium.
# This is a standalone shader pack, not a core-shader override in the ItemsAdder pack.

screen = <profile> [HALLOWEEN] *
screen.HALLOWEEN = HALLOWEEN_QUALITY BLOOD_MOON_STRENGTH HALLOWEEN_FOG_STRENGTH
sliders = BLOOD_MOON_STRENGTH HALLOWEEN_FOG_STRENGTH

# 0 = light, 1 = balanced, 2 = richer sky halo calculations
profile.LOW = HALLOWEEN_QUALITY:0 BLOOD_MOON_STRENGTH:0.60 HALLOWEEN_FOG_STRENGTH:0.35
profile.MEDIUM = HALLOWEEN_QUALITY:1 BLOOD_MOON_STRENGTH:0.90 HALLOWEEN_FOG_STRENGTH:0.65
profile.HIGH = HALLOWEEN_QUALITY:2 BLOOD_MOON_STRENGTH:1.00 HALLOWEEN_FOG_STRENGTH:0.85

# A private day marker is used only by the optional HalloweenCore client companion
# while the actual blood-moon-invasion event is active or transitioning.
