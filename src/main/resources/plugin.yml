name: HalloweenCore
version: 0.1.0-SNAPSHOT
main: cz.halloween.core.HalloweenCore
api-version: '1.21'
author: Admiral456
description: Halloween event core for Purpur/Paper 1.21.10.
softdepend: [Essentials, ItemsAdder, MythicMobs, ModelEngine, BattlePass, WorldGuard, PlaceholderAPI]
commands:
  spawn:
    description: Generate a Halloween structure directly in front of an administrator.
    usage: /spawn <hřbitov|vesnice|aréna|vampirearena|goblinarena>
    permission: halloweencore.structures
  halloween:
    description: Halloween event statistics and administration.
    usage: /halloween [stats|progress|curse|event|challenge|quests [reset <hráč>]|rewards|claim|top|reload|debug|shader|spawn <typ>|setsecret|secrets|boss|bosseffects|modelpreview|give|on|off]
    aliases: [hallow]
    permission: halloweencore.use
permissions:
  halloweencore.use:
    default: true
  halloweencore.admin:
    default: op
  halloweencore.structures:
    description: Allows manual Halloween structure generation.
    default: op
  halloweencore.structures.force:
    description: Allows overwriting natural terrain inside a generated structure footprint.
    default: op
