name: HalloweenCore
version: 0.3.0
main: cz.halloween.core.HalloweenCore
api-version: '1.21'
author: Admiral456
description: Denní Halloween questy, fragmenty a halloweenský obchod.
softdepend: [ItemsAdder]
commands:
  halloween:
    description: Questy, fragmenty a halloweenský obchod.
    usage: /halloween [quest|fragments|shop|reload]
    aliases: [hallow]
    permission: halloweencore.use
  quest:
    description: Získá nebo zobrazí denní úkol za fragment.
    usage: /quest
    aliases: [dailyquest]
    permission: halloweencore.use
permissions:
  halloweencore.use:
    description: Používání příkazů HalloweenCore.
    default: true
  halloweencore.admin:
    description: Správa konfigurace HalloweenCore.
    default: op
  halloweencore.quest.dialogue:
    description: Řízení questů z dialogové integrace.
    default: op
