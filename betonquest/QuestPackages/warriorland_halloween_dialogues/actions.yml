actions:
  # Při přijetí úkolu se stejný stav zapíše do HalloweenCore i do BetonQuestu.
  start_halloween_farmer_quest: "opsudo halloween quest start farmer_wheat"
  add_farmer_started_tag: "tag add farmer_started"
  accept_farmer_quest: "folder start_halloween_farmer_quest,add_farmer_started_tag"

  # Úkol ověří inventář, odebere 10 pšenic a vyplatí odměnu přes HalloweenCore.
  take_farmer_wheat: "take wheat:10 abort"
  complete_halloween_farmer_quest: "opsudo halloween quest complete farmer_wheat"
  add_farmer_completed_tag: "tag add farmer_completed"
  finish_farmer_quest_sequence: "folder take_farmer_wheat,complete_halloween_farmer_quest,add_farmer_completed_tag"

  tell_missing_wheat: "notify &cNemáš u sebe 10 kusů pšenice."
  turn_in_farmer_quest: "if has_farmer_wheat finish_farmer_quest_sequence else tell_missing_wheat"
