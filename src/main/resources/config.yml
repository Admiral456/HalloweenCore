# Only the new dialogue-quest and secret-room systems are configured here.
# The legacy mobs, bosses, random events, music, shader, shop and old progression systems were removed.
quests:
  # Leave definitions empty until quest objectives and rewards are agreed.
  # A quest without a definition has target 1, 0 fragments and no item reward.
  # When agreed, a definition may contain title, target, reward-fragments and reward-items.
  # Keep reward-fragments at 0 and reward-items empty until the exact rewards are decided.
  definitions: {}

rooms:
  enabled: true
  # Chance that a newly generated Overworld chunk contains one small secret room.
  chance-per-new-chunk: 0.05
  min-y: -36
  max-y: 24
  blocked-worlds:
    - Spawn
  key-item-id: warriorland_halloween:secret_room_key
  # The generated chest is intentionally empty until the exact contents are agreed.
