name: Build HalloweenCore

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure audio encoder
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate Halloween audio
        run: python3 scripts/generate_halloween_audio.py
      - name: Generate Halloween block textures
        run: python3 scripts/generate_halloween_block_textures.py
      - name: Validate Halloween assets
        run: python3 scripts/validate_halloween_assets.py
      - name: Validate Vampire King model
        run: python3 scripts/validate_vampire_model.py
      - name: Install Blockbench texture generator dependency
        run: python3 -m pip install --user Pillow
      - name: Generate additional Halloween mob models
        run: python3 scripts/generate_additional_halloween_mobs.py
      - name: Validate custom Halloween mob models
        run: python3 scripts/validate_special_mob_models.py
      - name: Build
        run: mvn -B clean package
      - name: Package ItemsAdder content
        run: |
          mkdir -p target
          cd itemsadder/contents
          zip -qr ../../target/WarriorLand-Halloween-ItemsAdder.zip warriorland_halloween
      - name: Upload ItemsAdder content pack
        uses: actions/upload-artifact@v4
        with:
          name: WarriorLand-Halloween-ItemsAdder
          path: target/WarriorLand-Halloween-ItemsAdder.zip
          if-no-files-found: error
          retention-days: 14
      - name: Package special mob models
        run: |
          mkdir -p target/halloween-mob-pack/MythicMobs/Mobs target/halloween-mob-pack/ModelEngine/blueprints
          cp mythicmobs/mobs/halloween-special-mobs.yml target/halloween-mob-pack/MythicMobs/Mobs/
          cp mythicmobs/models/halloween_*.bbmodel target/halloween-mob-pack/ModelEngine/blueprints/
          cp mythicmobs/models/halloween_*.png target/halloween-mob-pack/ModelEngine/blueprints/
          cp mythicmobs/README.md target/halloween-mob-pack/README.txt
          cd target/halloween-mob-pack
          zip -qr ../HalloweenCore-Special-Mobs-ModelEngine.zip .
          unzip -t ../HalloweenCore-Special-Mobs-ModelEngine.zip
      - name: Upload special mob ModelEngine pack
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-Special-Mobs-ModelEngine
          path: target/HalloweenCore-Special-Mobs-ModelEngine.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-jar
          path: target/HalloweenCore.jar
          if-no-files-found: error
          retention-days: 14

      - name: Package complete HalloweenCore install bundle
        run: |
          BUNDLE=target/HalloweenCore-install-bundle
          mkdir -p "$BUNDLE/plugins/ItemsAdder/contents" "$BUNDLE/plugins/MythicMobs/Mobs" "$BUNDLE/plugins/MythicMobs/Skills" "$BUNDLE/plugins/ModelEngine/blueprints"
          cp target/HalloweenCore.jar "$BUNDLE/plugins/HalloweenCore.jar"
          cp -R itemsadder/contents/warriorland_halloween "$BUNDLE/plugins/ItemsAdder/contents/"
          cp mythicmobs/mobs/halloween-special-mobs.yml mythicmobs/mobs/vampire-king.yml "$BUNDLE/plugins/MythicMobs/Mobs/"
          cp mythicmobs/skills/vampire-king.yml "$BUNDLE/plugins/MythicMobs/Skills/"
          cp mythicmobs/models/halloween_*.bbmodel mythicmobs/models/halloween_*.png mythicmobs/models/vampire_king.bbmodel mythicmobs/models/vampire_king.png "$BUNDLE/plugins/ModelEngine/blueprints/"
          cp mythicmobs/README.md "$BUNDLE/ModelEngine-MythicMobs-README.txt"
          cat > "$BUNDLE/INSTALL.txt" <<'EOF'
          HALLOWEENCORE — KOMPLETNÍ INSTALAČNÍ BALÍČEK
          1. Vypni server a zálohuj svět i složku plugins.
          2. Rozbal ZIP do kořenové složky serveru; všechny cesty začínají v plugins/.
          3. Ověř, že máš nainstalované kompatibilní verze ItemsAdder, MythicMobs a ModelEngine.
          4. Zapni server a spusť /mm reload.
          5. Spusť /halloween reload; obnoví ModelEngine a sestaví ItemsAdder resource pack.
          6. Ověř /iainfo a pak se odpoj a znovu připoj, aby klient dostal nové textury.
          Pokud mob zůstává černo-fialový, zkontroluj plugins/MythicMobs/Mobs/halloween-special-mobs.yml a soubory .bbmodel v plugins/ModelEngine/blueprints. Samotný JAR vlastní modely neobsahuje.
          EOF
          cd "$BUNDLE"
          zip -qr ../HalloweenCore-Install-Bundle.zip .
          unzip -t ../HalloweenCore-Install-Bundle.zip
      - name: Upload complete HalloweenCore install bundle
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-Install-Bundle
          path: target/HalloweenCore-Install-Bundle.zip
          if-no-files-found: error
          retention-days: 14
