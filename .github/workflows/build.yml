name: Build HalloweenCore

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Package candy ItemsAdder content
        run: |
          mkdir -p target
          cd itemsadder/contents
          zip -qr ../../target/HalloweenCore-Candy-ItemsAdder.zip warriorland_halloween
          unzip -t ../../target/HalloweenCore-Candy-ItemsAdder.zip

      - name: Upload candy ItemsAdder content
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-Candy-ItemsAdder
          path: target/HalloweenCore-Candy-ItemsAdder.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-jar
          path: target/HalloweenCore.jar
          if-no-files-found: error
          retention-days: 14
