name: HalloweenCore
version: 0.2.0-SNAPSHOT
main: cz.halloween.core.HalloweenCore
api-version: '1.21'
author: Admiral456
description: UplineDialogues quest bridge and locked underground secret rooms.
softdepend: [ItemsAdder, PlaceholderAPI]
commands:
  locate:
    description: Locate the nearest recorded Halloween secret room; other arguments pass to vanilla locate.
    usage: /locate <secretroom|vanilla structure arguments>
    permission: halloweencore.use
  halloween:
    description: Dialogue quests, quest fragments, secret-room status and key administration.
    usage: /halloween [quest|fragments|rooms|locate|key|reload]
    aliases: [hallow]
    permission: halloweencore.use
permissions:
  halloweencore.use:
    default: true
  halloweencore.admin:
    description: Allows reloading HalloweenCore configuration.
    default: op
  halloweencore.quest.manage:
    description: Allows dialogue/admin quest progress and completion commands.
    default: op
  halloweencore.key.give:
    description: Allows issuing test keys. Not an automatic player acquisition source.
    default: op
