# HalloweenCore custom mob definitions.
# Install in plugins/MythicMobs/Mobs/ and run /mm reload.
# Their models are in the companion HalloweenCore-Special-Mobs-ModelEngine.zip.
halloween_cursed_zombie:
  Type: ZOMBIE
  Display: '&2&lPROKLETÝ ZOMBIE'
  Health: 36
  Damage: 6
  Options:
    PreventOtherDrops: true
    PreventMobKillDrops: true
    Silent: true
    Despawn: true
    PreventSunburn: true
    MovementSpeed: 0.25
    KnockbackResistance: 0.15
    PreventRenaming: true
  Skills:
  - model{mid=halloween_cursed_zombie;n=false} @self ~onSpawn
  - state{mid=halloween_cursed_zombie;s=idle;} @self ~onSpawn
  - state{mid=halloween_cursed_zombie;s=hit_reaction} @self ~onDamaged
  - state{mid=halloween_cursed_zombie;s=death} @self ~onDeath
  - state{mid=halloween_cursed_zombie;s=frenzy} @self ~onAttack

