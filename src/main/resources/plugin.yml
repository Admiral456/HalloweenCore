name: HalloweenCore
version: 0.1.0-SNAPSHOT
main: cz.halloween.core.HalloweenCore
api-version: '1.21'
author: Admiral456
description: Halloween event core for Purpur/Paper 1.21.10.
softdepend: [ItemsAdder, MythicMobs, ModelEngine, BattlePass, WorldGuard, PlaceholderAPI]
commands:
  halloween:
    description: Halloween event statistics and administration.
    usage: /halloween [stats|progress|curse|event|challenge|quests [reset <hráč>]|rewards|claim|top|reload|debug|shader|setvillage|setgraveyard <id>|setvampirearena|buildvampirearena|setsecret|setrift|secrets|boss|bosseffects|modelpreview|give|on|off]
    aliases: [hallow]
    permission: halloweencore.use
permissions:
  halloweencore.use:
    default: true
  halloweencore.admin:
    default: op
