config-version: 2
# Only NPC dialogue quests and locked underground rooms remain in this build.
# UplineDialogues shows a random eligible quest from quests.definitions to the player.
# Add a quest by adding a definition; it joins the random pool by default.
# Set villager-offer-weight: 0 on a definition to exclude it, or a higher value to make it more likely.
# Quest-difficulty key chances. Individual quest definitions can override these odds.
quest-key-drop-chances-by-difficulty:
  light:
    common: 0.10
    rare: 0.01
    legendary: 0.001
  medium:
    common: 0.15
    rare: 0.035
    legendary: 0.005
  hard:
    common: 0.20
    rare: 0.06
    legendary: 0.02
  very-hard:
    common: 0.25
    rare: 0.10
    legendary: 0.08

quests:
  default-reward-fragments:
    light: 4
    medium: 7
    hard: 12
    very-hard: 20
  # Bonus key roll after a successful NPC quest turn-in. Remaining chance awards no key.
  key-drop-chances:
    common: 0.40
    rare: 0.10
    legendary: 0.05
  definitions:
    fresh_harvest:
      title: "Čerstvá sklizeň"
      difficulty: "Lehký"
      description: "Přines 32 pšenic místnímu farmáři."
      dialogue-story: "Poslední povozy z okolí přijely s menší zásobou, než se čekalo. Hugo nechce nechat vesnici bez jídla, dokud se nezjistí, proč se dodávky zpožďují."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:wheat
          amount: 32

    stone_for_repairs:
      title: "Kámen na opravy"
      difficulty: "Lehký"
      description: "Přines 64 kamenných kostek na opravu cesty."
      dialogue-story: "Na severní cestě se objevují nové praskliny. Kameník slyšel v noci zpod kopce duté rány, ale zatím nechce šířit poplach."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:cobblestone
          amount: 64

    paper_trail:
      title: "Papírová stopa"
      difficulty: "Lehký"
      description: "Přines 32 papírů pro kartografa."
      dialogue-story: "Ela našla na staré mapě začerněnou oblast. Než ji bude zkoumat, musí obnovit běžné mapy a ověřit, že nejde jen o poškozený záznam."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:paper
          amount: 32

    food_for_watch:
      title: "Jídlo pro hlídku"
      difficulty: "Lehký"
      description: "Přines 16 chlebů pro stráž u cesty."
      dialogue-story: "Noční hlídka hlásí slabé světlo u severního svahu. Tonda chce nejdřív zajistit, aby jeho lidé vydrželi celou směnu na stanovišti."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:bread
          amount: 16

    village_library:
      title: "Základy knihovny"
      difficulty: "Střední"
      description: "Dodej 8 knih do vesnické knihovny."
      dialogue-story: "Některé knihy se vracejí bez posledních stran a na polici zůstává jemný kamenný prach. Mara chce nejprve obnovit katalog, než začne pátrat dál."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:book
          amount: 8

    copper_samples:
      title: "Měděné vzorky"
      difficulty: "Střední"
      description: "Přines 32 měděných ingotů kováři."
      dialogue-story: "Oldřich si všiml, že některé měděné předměty ze starých štol časem zčernají. Potřebuje běžné vzorky, se kterými může porovnat nalezený kov."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:copper_ingot
          amount: 32

    iron_requisition:
      title: "Železná žádanka"
      difficulty: "Střední"
      description: "Přines 24 železných ingotů pro opravu nářadí."
      dialogue-story: "Horníci hlásí, že se i nové nástroje lámou rychleji než dřív. Radovan chce připravit náhradní součásti, než se někdo vydá do vzdálenějších štol."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:iron_ingot
          amount: 24

    amethyst_study:
      title: "Fialové krystaly"
      difficulty: "Střední"
      description: "Přines 12 ametystových úlomků badatelce."
      dialogue-story: "Nela našla v jeskyni krystaly, které vypadají jinak podle světla a hloubky. Nechce ničit celou geodu, stačí jí několik malých vzorků."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:amethyst_shard
          amount: 12

    alchemist_components:
      title: "Sada pro alchymistku"
      difficulty: "Těžký"
      description: "Dodej 16 pavoučích očí, 16 skleněných lahví a 8 plamenných prášků."
      dialogue-story: "Na ošetřovnu se vrátil horník s popáleninami, přestože tvrdil, že se lávy nedotkl. Žofie připravuje ochrannou směs a potřebuje doplnit laboratorní suroviny."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:spider_eye
          amount: 16
        - id: minecraft:glass_bottle
          amount: 16
        - id: minecraft:blaze_powder
          amount: 8

    archivist_records:
      title: "Ztracené záznamy"
      difficulty: "Těžký"
      description: "Přines 16 knih a 32 papírů archiváři."
      dialogue-story: "Viktor objevil ve starých zápisech popisy chodeb, které na mapách vůbec nejsou. Originály jsou křehké, proto chce vytvořit bezpečné kopie."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:book
          amount: 16
        - id: minecraft:paper
          amount: 32

    blacksmith_order:
      title: "Zakázka kováře"
      difficulty: "Těžký"
      description: "Přines 32 železných a 16 zlatých ingotů."
      dialogue-story: "Mistr kovář chystá opravu výstroje pro výpravu k místům, která někdo kdysi vyškrtnul z map. Než kohokoli vyšle, potřebuje mít všechen materiál připravený."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:iron_ingot
          amount: 32
        - id: minecraft:gold_ingot
          amount: 16

    deep_expedition:
      title: "Výprava do hlubin"
      difficulty: "Velmi těžký"
      description: "Přines 6 enderových perel a 16 plamenných prášků."
      dialogue-story: "Emil připravuje navigační značky pro hlubší průchody. Některé chodby vypadají na starých mapách kratší, než ve skutečnosti jsou."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:ender_pearl
          amount: 6
        - id: minecraft:blaze_powder
          amount: 16

    hidden_room_report:
      title: "Zpráva ze skryté místnosti"
      difficulty: "Těžký"
      description: "Najdi jednu zaznamenanou tajnou místnost a vrať se k badateli."
      repeatable: false
      dialogue-story: "Irena shromažďuje ověřené zprávy o podzemních místnostech, které v mapách chybějí. Nezajímá ji pověst ani odhad — potřebuje, aby někdo skutečně vstoupil dovnitř."
      objective-type: explore-room
      target: 1
      required-items: []

    sealed_archive:
      title: "Zapečetěný archiv"
      difficulty: "Velmi těžký"
      description: "Nejdřív vstup do tajné místnosti, potom přines 16 knih, 32 papírů a 12 ametystových úlomků."
      repeatable: false
      dialogue-story: "Strážce archivu hledá důkaz, že podzemní místnosti souvisejí se starými záznamy. Nejdřív musí být nález prozkoumán a pak bezpečně zapsán do několika kopií."
      objective-type: explore-and-deliver
      target: 1
      required-items:
        - id: minecraft:book
          amount: 16
        - id: minecraft:paper
          amount: 32
        - id: minecraft:amethyst_shard
          amount: 12

    night_research:
      title: "Výzkum po setmění"
      difficulty: "Velmi těžký"
      description: "Přines 16 pavoučích očí, 32 železných ingotů a 8 enderových perel."
      dialogue-story: "Pavel si všiml, že se výsledky jeho měření po setmění mění. Chce ověřit, jestli je příčinou chyba přístrojů, nebo něco v okolí hlubokých štol."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:spider_eye
          amount: 16
        - id: minecraft:iron_ingot
          amount: 32
        - id: minecraft:ender_pearl
          amount: 8

    mushroom_samples:
      title: "Vzorky z lesa"
      difficulty: "Lehký"
      description: "Přines 24 červených a 24 hnědých hub lesní sběratelce."
      dialogue-story: "Běla porovnává lesní houby z různých stran potoka. Na místech s nezvykle tvrdým kamenem se objevily druhy, které tam podle starých poznámek nerostly."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:red_mushroom
          amount: 24
        - id: minecraft:brown_mushroom
          amount: 24

    wool_for_bedding:
      title: "Lůžka pro hostinec"
      difficulty: "Lehký"
      description: "Dodej 32 bílých vln pro nové postele v hostinci."
      dialogue-story: "Do hostince přijíždí více cestujících než obvykle. Róza chce připravit další lůžka, protože se několik horníků vrací z cest a nemá kde přenocovat."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:white_wool
          amount: 32

    river_catch:
      title: "Úlovek z řeky"
      difficulty: "Střední"
      description: "Přines 16 tresek a 8 lososů kuchaři."
      dialogue-story: "Matěj čeká hosty, kteří se mají po setmění ptát na starou cestu pod kopcem. Připravuje jídlo, ale nechce kvůli tomu vyprázdnit řeku."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:cod
          amount: 16
        - id: minecraft:salmon
          amount: 8

    clay_for_potter:
      title: "Hlína pro hrnčíře"
      difficulty: "Lehký"
      description: "Přines 48 hliněných kuliček hrnčíři."
      dialogue-story: "Některé nádoby na vodu popraskaly zevnitř, jako by na ně tlačil kámen. Jáchym chce vyrobit náhrady dřív, než se zásoby začnou ztrácet."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:clay_ball
          amount: 48

    lantern_supplies:
      title: "Světlo na cestu"
      difficulty: "Střední"
      description: "Přines 32 pochodní pro osvětlení staré cesty."
      dialogue-story: "U severního svahu je stará šachta, jejíž hloubku nikdo nezná. Bohdan chce nejdřív bezpečně osvětlit cestu, aby se k ní lidé nepřiblížili ve tmě."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:torch
          amount: 32

    honey_for_healer:
      title: "Med pro léčitelku"
      difficulty: "Střední"
      description: "Dodej 8 lahví medu do vesnické ošetřovny."
      dialogue-story: "Několik vesničanů si stěžovalo na zvláštní kovovou chuť vody z hlubší studny. Anežka doplňuje zásoby na ošetřovně a čeká na další ověřené zprávy."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:honey_bottle
          amount: 8

    forest_materials:
      title: "Dřevo pro truhláře"
      difficulty: "Střední"
      description: "Přines 32 dubových klád na opravu nábytku."
      dialogue-story: "Jedna lavice ve společenské síni se propadla a pod podlahou se ukázala dutina, která na půdorysu není. Vít zatím opravuje nábytek a nechce nic rozebírat bez důvodu."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:oak_log
          amount: 32

    leather_repair:
      title: "Kožené řemeny"
      difficulty: "Těžký"
      description: "Přines 24 kusů kůže sedláři."
      dialogue-story: "Na brašnách vrácených z dolů jsou oděrky z vnitřní strany, jako by se opíraly o ostré kameny. Kamil chce vyměnit řemeny dřív, než se další výprava vydá na cestu."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:leather
          amount: 24

    map_and_compass:
      title: "Směr do podzemí"
      difficulty: "Těžký"
      description: "Přines 1 kompas a 16 papírů kartografovi."
      dialogue-story: "Ela našla několik starých map, na nichž čáry končí uprostřed skály. Potřebuje porovnat směr kompasu se záznamy, než začne zakreslovat nové podzemní průchody."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:compass
          amount: 1
        - id: minecraft:paper
          amount: 16

    miner_samples:
      title: "Hornické vzorky"
      difficulty: "Těžký"
      description: "Přines 24 uhlí a 16 kusů surového železa pro průzkum hlubin."
      dialogue-story: "Zdeněk mapuje nové štoly, kde se skladba kamene liší od starých chodeb. Chce vzorky z více míst a žádá, aby nikdo nerozšiřoval neznámé průchody."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:coal
          amount: 24
        - id: minecraft:raw_iron
          amount: 16

    dried_ghast_delivery:
      title: "Vysušený ghast pro alchymii"
      difficulty: "Velmi těžký"
      description: "Přines 20 bloků vysušeného ghasta pro přípravu ochranné směsi."
      dialogue-story: "Alchymistka chce zkusit mimořádně vzácnou ochrannou směs. Potřebuje dvacet bloků vysušeného ghasta, které se těžko shánějí i vyrábějí."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:dried_ghast
          amount: 20
      key-drop-chances:
        common: 0.20
        rare: 0.10
        legendary: 0.18

    iron_mining_contract:
      title: "Železo pro velkou zakázku"
      difficulty: "Velmi těžký"
      description: "Přines 40 železných ingotů do vesnické kovárny."
      dialogue-story: "Kovárna dostala velkou objednávku na opravy. Zásoby nestačí a kovář potřebuje pořádnou dodávku železa, ne jen pár ingotů."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:iron_ingot
          amount: 40
      key-drop-chances:
        common: 0.22
        rare: 0.08
        legendary: 0.10

    diamond_quota:
      title: "Pět diamantů pro archiv"
      difficulty: "Velmi těžký"
      description: "Přines 5 diamantů archiváři, který opravuje vzácný navigační přístroj."
      dialogue-story: "Archivář objevil přístroj s poškozeným diamantovým jádrem. Obyčejné suroviny už nepomohou; bez několika diamantů jej nedokáže opravit."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:diamond
          amount: 5
      key-drop-chances:
        common: 0.20
        rare: 0.10
        legendary: 0.14

    trident_hunt:
      title: "Trojzubec z hlubin"
      difficulty: "Velmi těžký"
      description: "Získej trojzubec a přines ho vesnickému průzkumníkovi."
      dialogue-story: "Průzkumník potřebuje trojzubec, který se podle svědectví ztratil v hlubokých vodách. Najít utopence, který ho drží, a získat zbraň nebude snadné."
      objective-type: delivery
      target: 1
      required-items:
        - id: minecraft:trident
          amount: 1
      key-drop-chances:
        common: 0.15
        rare: 0.10
        legendary: 0.20


rooms:
  enabled: true
  # Probability per newly generated Overworld chunk. Existing chunks are not auto-rescanned.
  chance-per-new-chunk: 0.025
  # Keep the room underground by default. Worlds with no solid volume simply skip that candidate.
  min-y: -36
  max-y: -8
  attempts-per-chunk: 48
  manual-attempts-per-chunk: 128
  manual-search-radius-chunks: 3
  blocked-worlds:
    - Spawn
  # Legacy COMMON-key setting is kept for existing configs.
  key-item-id: warriorland_halloween:secret_room_key
  key-item-ids:
    common: warriorland_halloween:secret_room_key
    rare: warriorland_halloween:secret_room_key_rare
    legendary: warriorland_halloween:secret_room_key_legendary
  # Relative weights are normalized automatically; defaults are 70/25/5.
  rarity-weights:
    common: 70
    rare: 25
    legendary: 5
  # Rarity-based loot uses vanilla materials only. Contents are rolled once when the correct key unlocks the chest.
  loot:
    common:
      min-fragments: 8
      max-fragments: 16
      items:
        - material: COAL
          min: 4
          max: 12
          chance: 0.90
        - material: IRON_INGOT
          min: 3
          max: 8
          chance: 0.85
        - material: GOLD_INGOT
          min: 1
          max: 4
          chance: 0.45
        - material: EMERALD
          min: 1
          max: 3
          chance: 0.30
        - material: BREAD
          min: 2
          max: 5
          chance: 0.50
        - material: COOKED_BEEF
          min: 2
          max: 5
          chance: 0.50
        - material: REDSTONE
          min: 4
          max: 12
          chance: 0.40
        - material: DIAMOND
          min: 1
          max: 1
          chance: 0.03
    rare:
      min-fragments: 20
      max-fragments: 35
      items:
        - material: DIAMOND
          min: 1
          max: 3
          chance: 0.95
        - material: GOLD_INGOT
          min: 4
          max: 10
          chance: 0.80
        - material: IRON_INGOT
          min: 8
          max: 16
          chance: 0.85
        - material: EMERALD
          min: 2
          max: 6
          chance: 0.60
        - material: ENCHANTED_BOOK
          min: 1
          max: 1
          chance: 0.40
          enchantments:
            - "unbreaking:2"
            - "efficiency:2"
            - "protection:2"
        - material: DIAMOND_PICKAXE
          min: 1
          max: 1
          chance: 0.12
          enchantments:
            - "efficiency:2"
            - "unbreaking:2"
        - material: DIAMOND_SWORD
          min: 1
          max: 1
          chance: 0.10
          enchantments:
            - "sharpness:2"
            - "unbreaking:2"
        - material: GOLDEN_APPLE
          min: 1
          max: 1
          chance: 0.10
    legendary:
      min-fragments: 40
      max-fragments: 70
      items:
        - material: DIAMOND
          min: 4
          max: 8
          chance: 0.95
        - material: EMERALD
          min: 4
          max: 10
          chance: 0.80
        - material: GOLD_INGOT
          min: 8
          max: 16
          chance: 0.80
        - material: ENCHANTED_BOOK
          min: 1
          max: 1
          chance: 0.24
          enchantments:
            - "mending:1"
            - "sharpness:4"
            - "protection:4"
        - material: DIAMOND_SWORD
          min: 1
          max: 1
          chance: 0.20
          enchantments:
            - "sharpness:3"
            - "unbreaking:3"
        - material: DIAMOND_PICKAXE
          min: 1
          max: 1
          chance: 0.20
          enchantments:
            - "efficiency:3"
            - "unbreaking:2"
        - material: DIAMOND_CHESTPLATE
          min: 1
          max: 1
          chance: 0.10
          enchantments:
            - "protection:3"
            - "unbreaking:2"
        - material: GOLDEN_APPLE
          min: 1
          max: 2
          chance: 0.25
        - material: NETHERITE_SCRAP
          min: 1
          max: 2
          chance: 0.06
        - material: TOTEM_OF_UNDYING
          min: 1
          max: 1
          chance: 0.02
