name: Build HalloweenCore

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install reward validator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate the agreed content scope
        run: python3 scripts/validate_new_scope.py
      - name: Validate quest rewards and secret-room loot
        run: python3 scripts/validate_rewards.py
      - name: Validate BetonQuest quest package
        run: python3 scripts/validate_betonquest.py
      - name: Build plugin
        run: mvn -B clean package
      - name: Package ItemsAdder content
        run: |
          mkdir -p target
          cd itemsadder/contents
          zip -qr "$GITHUB_WORKSPACE/target/WarriorLand-Halloween-ItemsAdder.zip" warriorland_halloween
      - name: Test packaged content archive
        run: unzip -t target/WarriorLand-Halloween-ItemsAdder.zip
      - name: Package BetonQuest quest package
        run: |
          mkdir -p target/betonquest-package/QuestPackages
          cp -R betonquest/QuestPackages/warriorland_halloween_dialogues target/betonquest-package/QuestPackages/
          cd target/betonquest-package
          zip -qr "$GITHUB_WORKSPACE/target/WarriorLand-Halloween-BetonQuest.zip" QuestPackages
          unzip -t "$GITHUB_WORKSPACE/target/WarriorLand-Halloween-BetonQuest.zip"
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-JAR
          path: target/HalloweenCore.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload ItemsAdder content
        uses: actions/upload-artifact@v4
        with:
          name: WarriorLand-Halloween-ItemsAdder
          path: target/WarriorLand-Halloween-ItemsAdder.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload BetonQuest package
        uses: actions/upload-artifact@v4
        with:
          name: WarriorLand-Halloween-BetonQuest
          path: target/WarriorLand-Halloween-BetonQuest.zip
          if-no-files-found: error
          retention-days: 14
