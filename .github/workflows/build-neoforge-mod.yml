name: Build HalloweenCore Native NeoForge Mod

on:
  push:
    paths:
      - 'mod-neoforge/**'
      - 'scripts/generate_native_mod_assets.py'
      - '.github/workflows/build-neoforge-mod.yml'
  pull_request:
    paths:
      - 'mod-neoforge/**'
      - 'scripts/generate_native_mod_assets.py'
      - '.github/workflows/build-neoforge-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install texture generator dependency
        run: python3 -m pip install Pillow
      - name: Generate native mod assets
        run: python3 scripts/generate_native_mod_assets.py
      - name: Build and run unit tests
        run: gradle -p mod-neoforge --no-daemon clean test build
      - name: Validate native mod archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          jars = list(Path("mod-neoforge/build/libs").glob("halloweencore-*.jar"))
          if not jars:
              raise SystemExit("Native NeoForge mod JAR was not produced")
          with ZipFile(jars[0]) as jar:
              names = set(jar.namelist())
              required = (
                  "META-INF/neoforge.mods.toml",
                  "assets/halloweencore/lang/cs_cz.json",
                  "assets/halloweencore/equipment/crimson_warden.json",
                  "data/halloweencore/worldgen/placed_feature/haunted_surface.json",
                  "cz/halloween/mod/HalloweenCoreMod.class",
              )
              for entry in required:
                  if entry not in names:
                      raise SystemExit(f"Missing required native mod entry: {entry}")
          print(f"Validated native mod archive: {jars[0]}")
          PY
      - name: Upload native mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-NeoForge-1.21.10
          path: mod-neoforge/build/libs/halloweencore-*.jar
          if-no-files-found: error
          retention-days: 30
