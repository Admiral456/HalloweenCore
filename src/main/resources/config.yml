random-events:
  enabled: true
  # After /halloween on, make the first event visible after a short delay.
  start-delay-seconds: 30
  interval-minutes:
    min: 20
    max: 35
  duration-minutes: 5
  surge-interval-seconds: 45
  max-event-mobs: 12
  event-mobs-enabled: true
  # Number of special mobs in each Blood Moon invasion wave (1–4).
  invasion-mobs-per-surge: 2
  special-mob-chance-multiplier: 1.50
  sound: "warriorland_halloween:event_sting"
  types:
    soulstorm:
      name: "Duševní bouře"
      start-message: "&6&lHALLOWEEN &8» &dDuše mrtvých se probudily. Po dobu &e%duration% minut &ddostáváš zvýšený zisk fragmentů z lovu."
