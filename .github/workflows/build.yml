name: Build HalloweenCore

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure audio encoder
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate Halloween audio
        run: python3 scripts/generate_halloween_audio.py
      - name: Generate Halloween block textures
        run: python3 scripts/generate_halloween_block_textures.py
      - name: Validate Halloween assets
        run: python3 scripts/validate_halloween_assets.py
      - name: Validate Vampire King model
        run: python3 scripts/validate_vampire_model.py
      - name: Install Blockbench texture generator dependency
        run: python3 -m pip install --user Pillow
      - name: Generate additional Halloween mob models
        run: python3 scripts/generate_additional_halloween_mobs.py
      - name: Validate custom Halloween mob models
        run: python3 scripts/validate_special_mob_models.py
      - name: Build
        run: mvn -B clean package
      - name: Package ItemsAdder content
        run: |
          mkdir -p target
          cd itemsadder/contents
          zip -qr ../../target/WarriorLand-Halloween-ItemsAdder.zip warriorland_halloween
      - name: Upload ItemsAdder content pack
        uses: actions/upload-artifact@v4
        with:
          name: WarriorLand-Halloween-ItemsAdder
          path: target/WarriorLand-Halloween-ItemsAdder.zip
          if-no-files-found: error
          retention-days: 14
      - name: Package special mob models
        run: |
          mkdir -p target/halloween-mob-pack/MythicMobs/Mobs target/halloween-mob-pack/ModelEngine/blueprints
          cp mythicmobs/mobs/halloween-special-mobs.yml target/halloween-mob-pack/MythicMobs/Mobs/
          cp mythicmobs/models/halloween_*.bbmodel target/halloween-mob-pack/ModelEngine/blueprints/
          cp mythicmobs/models/halloween_*.png target/halloween-mob-pack/ModelEngine/blueprints/
          cp mythicmobs/README.md target/halloween-mob-pack/README.txt
          cd target/halloween-mob-pack
          zip -qr ../HalloweenCore-Special-Mobs-ModelEngine.zip .
          unzip -t ../HalloweenCore-Special-Mobs-ModelEngine.zip
      - name: Upload special mob ModelEngine pack
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-Special-Mobs-ModelEngine
          path: target/HalloweenCore-Special-Mobs-ModelEngine.zip
          if-no-files-found: error
          retention-days: 14
      - name: Package Vampire King encounter assets
        run: |
          mkdir -p target/vampire-king-pack/MythicMobs/Mobs target/vampire-king-pack/MythicMobs/Skills target/vampire-king-pack/ModelEngine/blueprints
          cp mythicmobs/mobs/vampire-king.yml target/vampire-king-pack/MythicMobs/Mobs/
          cp mythicmobs/skills/vampire-king.yml target/vampire-king-pack/MythicMobs/Skills/
          cp mythicmobs/models/vampire_king.bbmodel target/vampire-king-pack/ModelEngine/blueprints/
          cp mythicmobs/models/vampire_king.png target/vampire-king-pack/ModelEngine/blueprints/
          cp docs/VAMPIRE_RUNTIME_CHECKLIST.md target/vampire-king-pack/
          cp docs/VAMPIRE_MODEL_ENGINE.md target/vampire-king-pack/
          cat > target/vampire-king-pack/README.txt <<'EOF'
          HalloweenCore - Vampire King ModelEngine/MythicMobs pack

          This archive contains the boss mob definition, reusable animation skills,
          Blockbench model, external texture and runtime checklists.

          1. Back up plugins/MythicMobs and plugins/ModelEngine before installation.
          2. Extract this archive over the server's plugins directory.
          3. Import ModelEngine/blueprints/vampire_king.bbmodel with the PNG beside it.
          4. Run /meg reload models and verify the model ID vampire_king loaded.
          5. Run /mm reload and check MythicMobs/Mobs/vampire-king.yml and Skills/vampire-king.yml loaded without errors.
          6. Merge "ModelEngine/resource pack" into the existing ItemsAdder resource-pack configuration, then run /iazip.
          7. Accept the rebuilt resource pack on a staging client and verify both wings, texture and all animations.
          8. Keep bosses.vampire.model.ready false until the in-game checklist passes.
          9. This pack does not enable the boss or bypass global progress/arena/readiness requirements.

          Paper/Purpur runtime testing is still required; successful packaging alone does not prove client rendering.
          EOF
          cd target/vampire-king-pack
          zip -qr ../HalloweenCore-Vampire-King-ModelEngine.zip .
          unzip -t ../HalloweenCore-Vampire-King-ModelEngine.zip
      - name: Upload Vampire King ModelEngine pack
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-Vampire-King-ModelEngine
          path: target/HalloweenCore-Vampire-King-ModelEngine.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HalloweenCore-jar
          path: target/HalloweenCore.jar
          if-no-files-found: error
          retention-days: 14
