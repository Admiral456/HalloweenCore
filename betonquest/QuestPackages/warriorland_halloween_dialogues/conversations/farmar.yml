conversations:
  farmar:
    quester: "Farmář"
    first: "completed,ongoing,offer"
    conversationIO: "menu"
    block_item_transfer: "true"

    NPC_options:
      completed:
        text: "Děkuji za pomoc. Tuhle zakázku už jsi splnil."
        conditions: "farmer_completed"

      ongoing:
        text: "Potřebuji deset kusů pšenice. Máš je už u sebe?"
        conditions: "farmer_started,!farmer_completed"
        pointers: "turn_in,not_yet"

      offer:
        text: "Ahoj, potřebuji deset kusů pšenice. Přineseš mi je?"
        conditions: "!farmer_started,!farmer_completed"
        pointers: "accept,decline"

      accepted:
        text: "Výborně. Přines mi deset kusů pšenice a odměna bude tvoje."

      success:
        text: "To je všechno. Tady máš pět Halloween fragmentů. Díky za pomoc!"

      reminder:
        text: "Vrať se, až budeš mít deset kusů pšenice."

      farewell:
        text: "Dobře, třeba příště."

    player_options:
      accept:
        text: "Přijímám úkol."
        actions: "accept_farmer_quest"
        pointers: "accepted"

      decline:
        text: "Teď ne."
        pointers: "farewell"

      turn_in:
        text: "Odevzdat deset kusů pšenice."
        conditions: "has_farmer_wheat,farmer_started,!farmer_completed"
        actions: "turn_in_farmer_quest"
        pointers: "success"

      not_yet:
        text: "Ještě je nemám."
        conditions: "!has_farmer_wheat,farmer_started,!farmer_completed"
        pointers: "reminder"
